name: Update LeetCode activity

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update-leetcode.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch LeetCode submission calendar
        env:
          LEETCODE_USERNAME: GRANDx47
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone

          query = {
              "query": """
                query userCalendar($username: String!) {
                  matchedUser(username: $username) {
                    submissionCalendar
                  }
                }
              """,
              "variables": {"username": os.environ["LEETCODE_USERNAME"]}
          }
          request = urllib.request.Request(
              "https://leetcode.com/graphql",
              data=json.dumps(query).encode(),
              headers={"Content-Type": "application/json", "User-Agent": "Mozilla/5.0"}
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          calendar = json.loads(payload["data"]["matchedUser"]["submissionCalendar"] or "{}")
          normalized_calendar = {
              datetime.fromtimestamp(int(timestamp), timezone.utc).date().isoformat(): count
              for timestamp, count in calendar.items()
          }
          output = {
              "username": os.environ["LEETCODE_USERNAME"],
              "updatedAt": datetime.now(timezone.utc).isoformat(),
              "submissionCalendar": normalized_calendar
          }
          with open("data/leetcode.json", "w", encoding="utf-8") as file:
              json.dump(output, file, indent=2)
              file.write("\n")

      - name: Fetch GitHub contribution calendar
        env:
          GITHUB_USERNAME: Utkarsh-UG
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timedelta, timezone
          from html.parser import HTMLParser
          import re

          class ContributionParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.calendar = {}
                  self.current_date = None
                  self.reading_tooltip = False

              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  if tag == "td" and values.get("data-date"):
                      self.current_date = values["data-date"]
                      self.calendar[self.current_date] = 0
                  elif tag == "tool-tip" and self.current_date:
                      self.reading_tooltip = True

              def handle_data(self, data):
                  if self.reading_tooltip and self.current_date:
                      match = re.search(r"([\d,]+) contribution", data)
                      if match:
                          self.calendar[self.current_date] = int(match.group(1).replace(",", ""))

              def handle_endtag(self, tag):
                  if tag == "tool-tip":
                      self.reading_tooltip = False
                      self.current_date = None

          end = datetime.now(timezone.utc).date()
          start = end - timedelta(days=365)
          url = (
              f"https://github.com/users/{os.environ['GITHUB_USERNAME']}/contributions"
              f"?from={start.isoformat()}&to={end.isoformat()}"
          )
          request = urllib.request.Request(url, headers={"User-Agent": "portfolio-activity-updater"})
          with urllib.request.urlopen(request, timeout=30) as response:
              markup = response.read().decode("utf-8")
          parser = ContributionParser()
          parser.feed(markup)
          if not parser.calendar:
              raise RuntimeError("GitHub contribution calendar was not found")
          output = {
              "username": os.environ["GITHUB_USERNAME"],
              "updatedAt": datetime.now(timezone.utc).isoformat(),
              "submissionCalendar": parser.calendar
          }
          with open("data/github.json", "w", encoding="utf-8") as file:
              json.dump(output, file, indent=2)
              file.write("\n")
          PY

      - name: Commit updated activity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/leetcode.json data/github.json
          git diff --cached --quiet || git commit -m "Update LeetCode activity"
          git push
